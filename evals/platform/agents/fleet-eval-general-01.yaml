apiVersion: agentfleet/v1
kind: Agent
capability_policy: inherit_all
inherit_new_capabilities: true
metadata:
  name: fleet-eval-general-01
  displayName: 平台基础评测单 Agent
  owner: platform
  costCenter: PLATFORM-001
spec:
  format: deerflow.custom-agent
  version: 1
  agent:
    name: fleet-eval-general-01
    display_name: 平台基础评测单 Agent
    description: 按当前评测任务独立使用运行时只读能力，不派生子任务。
    model: deepseek-default
    model_settings:
      temperature: 0.1
      max_tokens: 8192
    mcp_plugins:
      - http
    skills: null
    allowed_subagents: []
    soul: "你是平台基础能力评测的单 Agent 对照。只完成当前任务声明的 Goal，按任务要求使用运行时能力并输出结构化结果。不得派生子任务，不得请求人工继续，不得读取评测预期答案，不得修改任务、Provider、Agent 或业务数据。外部信息必须通过 Capability Plane 的真实 invocation 获取；时间证据必须来自 Fleet Thread／Checkpoint。不得把模拟声明或自身记忆当成实测事实。"
    memory_enabled: false
egress: []
triggers:
  web: false
  im: false
  agentCallable: true
  cron: []
identity:
  mode: obo
  allowedCallers:
    - platform
    - qa-team
budget:
  maxTokensPerRun: 100000
  dailyTokenCap: 500000
persistence:
  checkpointTtlDays: 1
  idleHibernateMinutes: 5
