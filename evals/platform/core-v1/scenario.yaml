schema_version: 1
id: core-v1
name: 平台多 Agent 自主编排与停止验收
description: >-
  开发／评测环境使用的平台参考场景。只评价 AMAgentFleet 的编排、协议、
  Runtime、证据、Playground 与工程成本，不评价第三方业务 KPI。
target_score: 75
read_only: true
dimensions:
  task_goal:
    weight: 20
    label: Task Pool 与 Goal 编排
  multi_agent:
    weight: 20
    label: 多 Agent 协作
  protocol:
    weight: 15
    label: 统一协议层
  runtime:
    weight: 10
    label: Runtime 复用与替换
  evidence_auth:
    weight: 10
    label: 共享 Evidence 与统一授权
  playground:
    weight: 15
    label: Playground 易用性
  engineering_cost:
    weight: 10
    label: 工程质量与净成本
hard_gates:
  - id: P0
    description: 多 Agent 协作、自动唤醒、独立评价与停止均完成，且无人工催促或预置输出
  - id: P1
    description: 协议、Runtime Contract 与安全通过，无越权 Effect 或秘密正文泄露
  - id: P2
    description: 非工程用户可独立完成注册、赋予 Goal、启动、观察证据与异常处理
baseline:
  required_for_full_score: true
  cap_when_missing: 74
repeatability:
  required_for_reusable: true
  min_runtime_types: 2
  min_third_party_agents: 2
  min_consecutive_stable_runs: 3
stop_conditions:
  target_score: 75
  max_no_improvement_rounds: 2
  max_experiments: 6
  max_tokens: 2000000
  max_minutes: 120
reference_workflow:
  - id: prepare
    action: 注册两个只读测试 Agent，加载 fixtures 与 expected 中的受控事实
  - id: delegate
    action: 指挥官自主选择 Agent 并创建真实子 Task／Loop，不预置 worker 输出
  - id: resume
    action: 子任务交付自动唤醒父 Thread，禁止人工催促
  - id: synthesize
    action: 指挥官读取真实 OUTPUT，组装事实并标明来源与未决项
  - id: verify
    action: 独立评价与确定性检查核对事实、副作用、成本和停止条件
fixtures:
  fleet_status: fixtures/fleet-status.json
  timeline_boards: fixtures/timeline-boards.json
expected_facts: expected/facts.json
runner:
  prompt_version: core-v1-runner-v1
  model_profile: deepseek-default
  single_agent: fleet-eval-single-01
  orchestrator: fleet-cmd-01
  workers:
    fleet_status: fleet-eval-source-a-01
    timeline_boards: fleet-eval-source-b-01
  poll_seconds: 5
measurement_protocol:
  north_star: stratified_zero_human_verified_success_rate
  goal_unit: 一次完整的 core-v1 参考工作流只计一次运行；子 Task 不单独计数
  accepted_goal: 确定性事实、来源、模式专属编排证据与停止条件全部通过
  success: 零人工介入、独立验收、安全和预算约束同时通过
  vgh_role: diagnostic_only
  vgh_formula: 60 * accepted_goals / active_human_minutes
  missing_human_time: VGH 返回 null 并记录 human_time_missing，不阻塞 SZ-VSR 的零人工判定
  human_time_includes:
    - 配置与发起
    - 补充提示与人工催促
    - 查证据与修复输出
    - 重新运行与异常恢复
    - 独立验收
  wall_time_separate: true
  single_agent_control:
    same_question: true
    same_fixtures: true
    same_model_profile: true
    same_acceptance: true
    allow_child_tasks: false
    persist_platform_candidate_report: false
  independent_gates:
    P1: 只能由协议、Runtime Contract 与安全证据输入确认，缺省 false
    P2: 只能由非工程用户核心路径验收输入确认，缺省 false
    playground: 缺省等级 0，不得由 Agent 自评
  baseline:
    required_fields:
      - scenario_id
      - prompt_version
      - model_profile
      - fixtures_sha256
      - accepted_goal
      - human_intervention_count
    reject_incompatible: true
  recommendation_flow: proposed -> accepted -> implemented -> verified/closed 或 failed；禁止自动开发
