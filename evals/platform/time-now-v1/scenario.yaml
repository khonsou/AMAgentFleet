schema_version: 1
id: time-now-v1
name: 平台时间证据与东八区换算
case_type: time_now
description: 通过 Fleet Thread／Checkpoint 获取真实时间，不依赖模型内部时钟。
read_only: true
dimensions:
  task_goal: {weight: 20, label: Task Goal}
  multi_agent: {weight: 20, label: 协作按需}
  protocol: {weight: 15, label: 时间证据协议}
  runtime: {weight: 10, label: Runtime 状态}
  evidence_auth: {weight: 10, label: 来源证据}
  playground: {weight: 15, label: 独立验收}
  engineering_cost: {weight: 10, label: 成本}
hard_gates:
  - {id: P0, description: 真实时间戳、Thread 来源和时区换算全部通过}
  - {id: P1, description: 协议与安全独立证据}
  - {id: P2, description: 非工程用户独立验收}
baseline: {cap_when_missing: 74}
repeatability: {min_runtime_types: 2, min_third_party_agents: 2, min_consecutive_stable_runs: 3}
stop_conditions: {target_score: 75, max_no_improvement_rounds: 2, max_experiments: 6, max_tokens: 200000, max_minutes: 10}
runner:
  prompt_version: time-now-v1
  model_profile: deepseek-default
  single_agent: fleet-eval-general-01
  orchestrator: fleet-cmd-01
  poll_seconds: 3
measurement_protocol:
  north_star: stratified_zero_human_verified_success_rate
  success: zero_human_and_independent_time_evidence_and_safe_and_within_budget
  time_source: fleet_thread_checkpoint
  timezone: Asia/Shanghai
  vgh_role: diagnostic_only
