apiVersion: v1
kind: Service
metadata:
  name: am-agent-fleet-console-web
  labels:
    app.kubernetes.io/part-of: am-agent-fleet
spec:
  selector:
    app: am-agent-fleet-console-web
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: am-agent-fleet-console-web
  labels:
    app.kubernetes.io/part-of: am-agent-fleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: am-agent-fleet-console-web
  template:
    metadata:
      labels:
        app: am-agent-fleet-console-web
        app.kubernetes.io/part-of: am-agent-fleet
    spec:
      automountServiceAccountToken: false
      containers:
        - name: console-web
          image: __FRONTEND_IMAGE__
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
      imagePullSecrets:
        - name: aliyun-reg-secret
