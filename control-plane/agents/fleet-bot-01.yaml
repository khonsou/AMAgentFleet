apiVersion: agentfleet/v1
kind: Agent
metadata:
  name: fleet-bot-01
  displayName: 测试机器人甲
  owner: qa-team
  costCenter: QA-001
spec:
  format: deerflow.custom-agent
  version: 1
  agent:
    name: fleet-bot-01
    display_name: 测试机器人甲
    description: bot 测试用：简单问答回显
    model: deepseek-default
    model_settings:
      temperature: 0.1
    mcp_plugins: []
    skills: null
    soul: 你是 bot 测试机器人甲。只回答一句话，用于验证 bot 接入链路是否畅通。
    memory_enabled: false
egress: []
triggers:
  web: true
  cron: []
identity:
  mode: obo
  allowedCallers:
  - qa-team
budget:
  maxTokensPerRun: 200000
