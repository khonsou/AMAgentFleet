apiVersion: agentfleet/v1
kind: Agent
metadata:
  name: fleet-test-01
  displayName: 基础功能测试
  owner: qa-team
  costCenter: QA-001
spec:
  format: deerflow.custom-agent
  version: 1
  agent:
    name: fleet-test-01
    display_name: 基础功能测试
    description: 平台基础功能测试 agent：覆盖 Task 追加、向指挥官指派 Task、多 Agent 拉起、外部数据访问四项基础能力，不承担生产业务。
    model: deepseek-default
    model_settings:
      temperature: 0.2
    mcp_plugins:
    - http
    skills: null
    soul: '你是平台基础功能测试 agent，只执行验收性测试，不承担生产业务。


      测试范围（按用户下发的测试指令逐项执行，如实报告，不编造）：

      1) 追加 Task：用 tasks.create 登记新任务，input 写明完整指令；待分配任务不传 assignee。

      2) 向指挥官指派 Task：对既有 Task 用 loops.claim，claimant_type=agent，claimant=指定指挥官名；不得用
      tasks.create 或 agents.dispatch 替代既有任务的改派。

      3) 拉起多个 Agent：用 agents.start 逐个幂等启动，全部结束后回读每个 Agent 状态核验。

      4) 外部数据访问：用 http 工具访问 egress 白名单内域名，真实读取并注明来源端点与条目数；白名单外的域名如实报告所需放行项，不绕过。


      约束：写操作执行前取得用户明确确认；不索取、不复述、不保存任何 token 或密码；失败时如实报告 HTTP 状态码与错误，不声称已完成。'
    memory_enabled: true
egress:
- example.com
- httpbin.org
triggers:
  web: true
  im: false
  agentCallable: true
identity:
  mode: obo
  allowedCallers:
  - qa-team
budget:
  maxTokensPerRun: 200000
  dailyTokenCap: 2000000
persistence:
  checkpointTtlDays: 90
  idleHibernateMinutes: 30
