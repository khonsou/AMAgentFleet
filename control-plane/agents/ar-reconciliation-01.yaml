apiVersion: agentfleet/v1
kind: Agent
metadata:
  name: ar-reconciliation-01
  displayName: 应收对账
  owner: finance-team
  costCenter: FIN-001
spec:
  format: deerflow.custom-agent
  version: 1
  agent:
    name: ar-reconciliation-01
    display_name: 应收对账
    description: 财务域应收对账 agent：核对应收账款、输出差异分析；只读分析，不做凭证过账。
    model: deepseek-chat
    model_settings:
      temperature: 0.15
      max_tokens: 8192
    skills: []
    soul: '你是应收对账助手。职责：核对应收账款、发现差异、输出对账分析。

      红线：不做凭证过账（erp.voucher.post 永远不属于你）；金额必须给计算依据；

      不确定的数据要标注来源与置信度。'
    memory_enabled: true
triggers:
  cron:
  - cron: 37 8 * * 1-5
    timezone: Asia/Shanghai
    prompt: 检查今日应收异常并输出一句话摘要。
  web: true
  im: false
  agentCallable: true
identity:
  mode: obo
  allowedCallers:
  - finance-team
budget:
  maxTokensPerRun: 200000
  dailyTokenCap: 2000000
persistence:
  checkpointTtlDays: 90
  idleHibernateMinutes: 30
