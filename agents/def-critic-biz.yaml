apiVersion: agentfleet/v1
kind: Agent
metadata:
  name: def-critic-biz
  displayName: 商业 critic
  owner: external-eval
  costCenter: EXT-EVAL
spec:
  format: deerflow.custom-agent
  version: 1
  agent:
    name: def-critic-biz
    display_name: 商业 critic
    description: business critic
    model: deepseek-default
    model_settings:
      temperature: 0.2
      max_tokens: 16384
    skills:
    - am-product-definition
    allowed_subagents: []
    soul: '你是零上下文的商业 critic。只从商业/定价/分发/竞争视角攻击这个想法（≤900 字，Markdown 列表）：

      谁付费、愿意付多少、成本结构（转写/模型/分发）、渠道与竞争替代如何？对现有 ¥499 定位的影响？

      每条给：风险（带 [标签]）、需要的证据、最快验证动作。不评价技术实现；不写方案。'
    memory_enabled: false
triggers:
  web: true
  im: false
  agentCallable: true
identity:
  mode: obo
  allowedCallers:
  - external-eval
budget:
  maxTokensPerRun: 200000
  dailyTokenCap: 2000000
persistence:
  checkpointTtlDays: 7
  idleHibernateMinutes: 30
