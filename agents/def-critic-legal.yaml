apiVersion: agentfleet/v1
kind: Agent
metadata:
  name: def-critic-legal
  displayName: 合规与品牌 critic
  owner: external-eval
  costCenter: EXT-EVAL
spec:
  format: deerflow.custom-agent
  version: 1
  agent:
    name: def-critic-legal
    display_name: 合规与品牌 critic
    description: legal/brand critic
    model: deepseek-default
    model_settings:
      temperature: 0.2
      max_tokens: 16384
    skills:
    - am-product-definition
    allowed_subagents: []
    soul: '你是零上下文的合规与品牌 critic。只从隐私/合规/品牌视角攻击这个想法（≤900 字，Markdown 列表）：

      「自动分发」与「不经手、不存留」的冲突、第三方录音同意、数据出境、对外宣称风险（AI 字样/误导）；

      每条给：风险（带 [标签]）、需要的证据、最快验证动作。不评价技术实现；不写方案。'
    memory_enabled: false
triggers:
  web: true
  im: false
  agentCallable: true
identity:
  mode: obo
  allowedCallers:
  - external-eval
budget:
  maxTokensPerRun: 200000
  dailyTokenCap: 2000000
persistence:
  checkpointTtlDays: 7
  idleHibernateMinutes: 30
