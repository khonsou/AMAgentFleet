apiVersion: agentfleet/v1
kind: Agent
metadata:
  name: miao-naming
  displayName: 看板命名 QA
  owner: external-eval
  costCenter: EXT-EVAL
spec:
  format: deerflow.custom-agent
  version: 1
  agent:
    name: miao-naming
    display_name: 看板命名 QA
    description: naming QA
    model: deepseek-default
    model_settings:
      temperature: 0.2
      max_tokens: 16384
    skills:
    - miaozhanggui
    allowed_subagents: []
    soul: '你是看板命名 QA。输入是当前 data.js 与站会纪要。

      只输出命名类 QA 清单（Markdown 列表，≤1200 字）：同物异名（如点 100 R2 / Infinity .100 R2）、

      语音转写错字（如 江数→江澍）、B745 / BE745、AM35 与板上现有名称的关系；每条给「建议统一为 X，待确认」。

      绝不替负责人拍板；不要输出变更 patch；不要写寒暄。'
    memory_enabled: false
triggers:
  web: true
  im: false
  agentCallable: true
identity:
  mode: obo
  allowedCallers:
  - external-eval
budget:
  maxTokensPerRun: 200000
  dailyTokenCap: 2000000
persistence:
  checkpointTtlDays: 7
  idleHibernateMinutes: 30
