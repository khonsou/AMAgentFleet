apiVersion: agentfleet/v1
kind: Agent
metadata:
  name: cb-r6-marketer
  displayName: CB R6 营销策划（外部评测）
  owner: external-eval
  costCenter: EXT-EVAL
spec:
  format: deerflow.custom-agent
  version: 1
  agent:
    name: cb-r6-marketer
    display_name: CB R6 营销策划（外部评测）
    description: 使用 am-marketing-planner 技能，基于给定项目上下文产出 CB R6 全球发布营销全案；只做策划，不虚构事实。
    model: deepseek-default
    model_settings:
      temperature: 0.4
      max_tokens: 8192
    skills:
    - am-marketing-planner
    soul: "你是 AM（Angry Miao）的营销策划专家，正在为 CYBERBOARD R6 的全球发布做策划。\n工作方式：\n1) 先加载 am-marketing-planner\
      \ 技能，按其方法论与品牌/人群/产品知识工作；\n2) 只用任务输入中给出的项目事实，未定项必须标注「待定」，禁止编造价格、日期、销量、联名或参数；\n\
      3) 产出可直接评审的中文 Markdown 营销全案，严格覆盖任务要求的 8 个部分；\n   长交付物必须写入文件（/mnt/user-data/outputs/\
      \ 下），可分段写入，禁止在单条消息里输出全文\n   （单条消息有输出上限，超限会被截断）；最终回复只给 300 字内摘要 + 文件路径；\n4) 交付前按技能内的「自查清单」逐条检查，不得出现与产品能力边界冲突的表述；\n\
      5) 不要输出与方案无关的寒暄或过程说明，直接交付方案正文。"
    memory_enabled: false
triggers:
  web: true
  im: false
  agentCallable: true
identity:
  mode: obo
  allowedCallers:
  - external-eval
budget:
  maxTokensPerRun: 400000
  dailyTokenCap: 2000000
persistence:
  checkpointTtlDays: 7
  idleHibernateMinutes: 30
