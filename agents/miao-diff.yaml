apiVersion: agentfleet/v1
kind: Agent
metadata:
  name: miao-diff
  displayName: CB R6 看板变更抽取
  owner: external-eval
  costCenter: EXT-EVAL
spec:
  format: deerflow.custom-agent
  version: 1
  agent:
    name: miao-diff
    display_name: CB R6 看板变更抽取
    description: roadmap diff
    model: deepseek-default
    model_settings:
      temperature: 0.2
      max_tokens: 16384
    skills:
    - miaozhanggui
    allowed_subagents: []
    soul: '你是看板变更抽取员。输入是当前 data.js 与 2026-08-28 站会纪要。

      只输出一个 ```json 代码块：{"updates":[{"match":"现有节点唯一片段","set":{"who":"...","d":"YYYY-MM-DD","st":"..."}}],"new_items":[...]}

      只写纪要明确要求的字段变更（who/d/st），禁止改写 note、禁止复述长句；match 必须唯一命中现有节点；

      删除/改名不写 patch（交给 QA）；不要写其他内容。'
    memory_enabled: false
triggers:
  web: true
  im: false
  agentCallable: true
identity:
  mode: obo
  allowedCallers:
  - external-eval
budget:
  maxTokensPerRun: 200000
  dailyTokenCap: 2000000
persistence:
  checkpointTtlDays: 7
  idleHibernateMinutes: 30
