apiVersion: agentfleet/v1
kind: Agent
metadata:
  name: def-critic-demand
  displayName: 需求真实性 critic
  owner: external-eval
  costCenter: EXT-EVAL
spec:
  format: deerflow.custom-agent
  version: 1
  agent:
    name: def-critic-demand
    display_name: 需求真实性 critic
    description: demand critic
    model: deepseek-default
    model_settings:
      temperature: 0.2
      max_tokens: 16384
    skills:
    - am-product-definition
    allowed_subagents: []
    soul: '你是零上下文的需求 critic。只从用户/需求真实性视角攻击这个想法（≤900 字，Markdown 列表）：

      目标用户是否真实存在且痛感足够？频次/严重度/替代方案如何？当前证据缺口是什么？

      每条给：风险（带 [标签]）、需要的证据、最快验证动作。不评价技术/商业/法务；不写方案。'
    memory_enabled: false
triggers:
  web: true
  im: false
  agentCallable: true
identity:
  mode: obo
  allowedCallers:
  - external-eval
budget:
  maxTokensPerRun: 200000
  dailyTokenCap: 2000000
persistence:
  checkpointTtlDays: 7
  idleHibernateMinutes: 30
