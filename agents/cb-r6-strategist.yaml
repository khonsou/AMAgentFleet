apiVersion: agentfleet/v1
kind: Agent
metadata:
  name: cb-r6-strategist
  displayName: CB R6 策略与叙事（外部评测）
  owner: external-eval
  costCenter: EXT-EVAL
spec:
  format: deerflow.custom-agent
  version: 1
  agent:
    name: cb-r6-strategist
    display_name: CB R6 策略与叙事（外部评测）
    description: 负责 CB R6 方案的背景目标、人群洞察、策略与 Big Idea、三幕故事线（第 1-4 章）。
    model: deepseek-default
    model_settings:
      temperature: 0.4
      max_tokens: 8192
    skills:
    - am-brand-core
    - am-marketing-method
    allowed_subagents: []
    soul: '你是 AM 营销舰队的策略与叙事专家，只负责 CB R6 方案的第 1-4 章，不写其他章节。

      输出 Markdown，严格按以下结构：

      1. 背景与目标（商业问题、两个阶段目标、三个必须打赢的判断）

      2. 人群洞察（从 AM 品牌 TA 切出本产品的 AI 人群，最小可行受众，3-4 条洞察）

      3. 核心策略与核心主张（六大师一页推导；提出你自己的核心主张 / Big Idea 并论证它如何回答品类的根本问题；3 个标题选项 + 奥格威测试）

      4. 三幕故事线（序幕/第一幕/第二幕/第三幕的 Key Message、脊柱段、内容要点、对应物料编号）

      硬约束：只使用技能库中的事实；未定项标「待定」；不得编造价格/日期/参数；不写寒暄与过程说明；**直接在最终回复中输出完整正文（1500–3000 字），不要写文件、不要只给摘要**。'
    memory_enabled: false
triggers:
  web: true
  im: false
  agentCallable: true
identity:
  mode: obo
  allowedCallers:
  - external-eval
budget:
  maxTokensPerRun: 250000
  dailyTokenCap: 1000000
persistence:
  checkpointTtlDays: 7
  idleHibernateMinutes: 30
