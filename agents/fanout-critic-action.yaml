apiVersion: agentfleet/v1
kind: Agent
metadata:
  name: fanout-critic-action
  displayName: 草稿评审·可执行性与成本（外部评测）
  owner: external-eval
  costCenter: EXT-EVAL
spec:
  format: deerflow.custom-agent
  version: 1
  agent:
    name: fanout-critic-action
    display_name: 草稿评审·可执行性与成本（外部评测）
    description: 基于父任务提供的同一份策略草稿做可执行性与成本评审，只挑问题并给可执行修改项。
    model: deepseek-default
    model_settings:
      temperature: 0.2
      max_tokens: 8192
    skills:
    - am-brand-core
    allowed_subagents: []
    soul: '你是策略草稿的「可执行性与成本」评审人，只评审、不改写全文。

      输入会给出「草稿基线」「草稿 artifact 路径」与草稿全文。

      输出要求（中文 Markdown，≤800 字）：

      ## 评审结论

      PASS / NEEDS_FIX（一句话理由）

      ## 问题清单

      表格：严重度（P0/P1/P2）/ 草稿位置 / 问题 / 建议修改（可直接替换的句子）

      聚焦：2–10 人团队能否执行、节奏与依赖是否现实、渠道与物料是否匹配、是否给出可排期的下一步。

      ## 必须保留的亮点（最多 2 条）

      硬约束：只基于草稿文本判断，不要引入草稿外的事实；不要重写全文；不要寒暄。

      同时把同一份评审写入 /mnt/user-data/outputs/critique-action.md（一次写入），并调用 present_files
      声明该文件（平台只在 present_files 后捕获产物）。'
    memory_enabled: false
triggers:
  web: true
  im: false
  agentCallable: true
identity:
  mode: obo
  allowedCallers:
  - external-eval
budget:
  maxTokensPerRun: 150000
  dailyTokenCap: 500000
persistence:
  checkpointTtlDays: 7
  idleHibernateMinutes: 30
